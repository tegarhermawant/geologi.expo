<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Splitter Tool - Geologi Expo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --primary: #f82249;
            --primary-dark: #e00a2f;
            --dark-bg: #101522;
            --card-bg: #191f2e;
            --text-main: #ffffff;
            --text-muted: #aebbcc;
            --border: #2a3042;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(16, 21, 34, 0.9);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(248, 34, 73, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            color: #fff;
            font-weight: 500;
        }

        /* Header */
        header {
            background: rgba(16, 21, 34, 0.9);
            padding: 1rem 5%;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand span { color: var(--primary); }

        .container {
            flex: 1;
            padding: 2rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }

        /* Controls Panel */
        .controls-panel {
            flex: 1;
            min-width: 300px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .panel-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-col {
            flex: 1;
        }

        input[type="number"], input[type="file"] {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        /* Custom File Input */
        .file-drop-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            padding: 2rem;
            border: 2px dashed var(--border);
            border-radius: 12px;
            transition: 0.2s;
            cursor: pointer;
            text-align: center;
        }
        
        .file-drop-area:hover, .file-drop-area.drag-over {
            border-color: var(--primary);
            background: rgba(248, 34, 73, 0.05);
        }
        
        .fake-btn {
            background: var(--border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .file-msg {
            font-size: 0.9rem;
            color: var(--text-muted);
            word-break: break-all;
        }
        
        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            cursor: pointer;
            opacity: 0;
        }

        button.btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button.btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(248, 34, 73, 0.3);
        }
        
        button.btn-primary:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Preview Panel */
        .preview-panel {
            flex: 2;
            min-width: 300px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 500px;
        }

        .preview-container {
            max-width: 100%;
            max-height: 600px;
            position: relative;
            overflow: auto;
            border: 1px solid var(--border);
            background-image: 
                linear-gradient(45deg, #1f2533 25%, transparent 25%), 
                linear-gradient(-45deg, #1f2533 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1f2533 75%), 
                linear-gradient(-45deg, transparent 75%, #1f2533 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        
        #gridOverlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        
        .slice-rect {
            position: absolute;
            border: 1px solid rgba(248, 34, 73, 0.8);
            background: rgba(248, 34, 73, 0.1);
            box-sizing: border-box;
        }

        .empty-state {
            text-align: center;
            color: var(--border);
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Result Area */
        .result-area {
            width: 100%;
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 2rem;
            display: none;
        }
        
        .result-title {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: var(--text-main);
        }
        
        .image-grid {
            display: grid;
            gap: 10px;
        }
        
        .image-piece {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 4px;
            transition: 0.2s;
        }
        
        .image-piece:hover {
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .stats {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .preview-panel {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Processing...</div>
    </div>

    <header>
        <a href="../../index.html" class="brand">
            <i class="fa fa-layer-group" style="color: var(--primary);"></i>
            GEOLOGI <span>EXPO</span>
        </a>
        <a href="../../index.html" style="color: #fff; text-decoration: none; font-size: 0.9rem;">
            <i class="fa fa-arrow-left"></i> Back to Home
        </a>
    </header>

    <div class="container">
        
        <!-- Controls Side -->
        <div class="controls-panel">
            <div class="panel-header">
                <h2 class="panel-title">Split Settings</h2>
            </div>

            <div class="form-group">
                <div class="file-drop-area" id="dropArea">
                    <span class="fake-btn">Choose Image</span>
                    <span class="file-msg">or drag and drop file here</span>
                    <input class="file-input" type="file" id="imageInput" accept="image/*">
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label class="form-label">Columns (Horizontal)</label>
                        <input type="number" id="colsInput" value="3" min="1" max="20">
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label class="form-label">Rows (Vertical)</label>
                        <input type="number" id="rowsInput" value="1" min="1" max="20">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Overlap (Pixels)</label>
                <div style="position: relative;">
                    <input type="number" id="overlapInput" value="0" min="0">
                    <span style="position: absolute; right: 10px; top: 12px; color: var(--text-muted); font-size: 0.8rem;">px</span>
                </div>
                <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 5px; display: block;">Adds extra pixels to the right/bottom of each slice.</small>
            </div>

            <button id="splitBtn" class="btn-primary" disabled>
                <i class="fa fa-scissors"></i> Split & Download ZIP
            </button>
            
            <div id="stats" class="stats"></div>
        </div>

        <!-- Preview Side -->
        <div class="preview-panel">
            <div class="empty-state" id="emptyState">
                <i class="fa fa-image"></i>
                <p>Upload an image to start</p>
                <small style="color: var(--text-muted)">Supports JPEG, PNG. Optimized for large files.</small>
            </div>
            
            <div class="preview-container" id="previewContainer" style="display: none;">
                <canvas id="sourceCanvas"></canvas>
                <div id="gridOverlay"></div>
            </div>
            
            <div class="result-area" id="resultArea">
                <h3 class="result-title">Preview Pieces</h3>
                <div class="image-grid" id="imageGrid"></div>
            </div>
        </div>

    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const dropArea = document.getElementById('dropArea');
        const fileMsg = document.querySelector('.file-msg');
        const colsInput = document.getElementById('colsInput');
        const rowsInput = document.getElementById('rowsInput');
        const overlapInput = document.getElementById('overlapInput');
        const splitBtn = document.getElementById('splitBtn');
        const sourceCanvas = document.getElementById('sourceCanvas');
        const ctx = sourceCanvas.getContext('2d');
        const gridOverlay = document.getElementById('gridOverlay');
        const emptyState = document.getElementById('emptyState');
        const previewContainer = document.getElementById('previewContainer');
        const resultArea = document.getElementById('resultArea');
        const imageGrid = document.getElementById('imageGrid');
        const stats = document.getElementById('stats');
        
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        let originalImage = null;
        let originalImageUrl = null;

        function showLoading(msg) {
            loadingText.textContent = msg || 'Processing...';
            loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        // File Input Handling
        imageInput.addEventListener('change', handleFileSelect);

        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropArea.classList.add('drag-over');
        }

        function unhighlight(e) {
            dropArea.classList.remove('drag-over');
        }

        dropArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length) {
                imageInput.files = files;
                handleFileSelect({ target: { files: files } });
            }
        }

        function handleFileSelect(e) {
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                fileMsg.textContent = file.name;
                
                showLoading("Loading Image...");

                // Use setTimeout to allow UI to update
                setTimeout(() => {
                    if (originalImageUrl) {
                        URL.revokeObjectURL(originalImageUrl);
                    }

                    // Use CreateObjectURL for performance (instead of FileReader)
                    originalImageUrl = URL.createObjectURL(file);
                    
                    originalImage = new Image();
                    originalImage.onload = function() {
                        initCanvas();
                        splitBtn.disabled = false;
                        updatePreviewGrid();
                        hideLoading();
                    };
                    originalImage.onerror = function() {
                        alert("Failed to load image. Please try another file.");
                        hideLoading();
                    }
                    originalImage.src = originalImageUrl;
                }, 100);
            }
        }

        // Inputs triggering update
        [colsInput, rowsInput, overlapInput].forEach(input => {
            input.addEventListener('input', updatePreviewGrid);
        });

        function initCanvas() {
            emptyState.style.display = 'none';
            previewContainer.style.display = 'block';
            
            sourceCanvas.width = originalImage.width;
            sourceCanvas.height = originalImage.height;
            ctx.drawImage(originalImage, 0, 0);
        }

        function updatePreviewGrid() {
            if (!originalImage) return;

            const cols = parseInt(colsInput.value) || 1;
            const rows = parseInt(rowsInput.value) || 1;
            const overlap = parseInt(overlapInput.value) || 0;
            const width = originalImage.width;
            const height = originalImage.height;

            const cellWidth = Math.floor(width / cols);
            const cellHeight = Math.floor(height / rows);

            gridOverlay.innerHTML = ''; // Clear existing
            
            // stats
            stats.innerHTML = `Original: ${width}x${height}px <br> Base Tile: ${cellWidth}x${cellHeight}px (+${overlap}px overlap) <br> <span style="font-size:0.75rem; opacity:0.8">*Edge tiles are clipped to image bounds</span>`;

            if (cols * rows > 500) return; // Performance cap for preview

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    // Center Overlap Logic
                    // Base coordinates (before overlap)
                    const baseX = c * cellWidth;
                    const baseY = r * cellHeight;
                    
                    // Distribute overlap (half left, half right)
                    // Use floor for consistent pixel alignment
                    const overlapLeft = Math.floor(overlap / 2);
                    const overlapTop = Math.floor(overlap / 2);
                    const overlapRight = overlap - overlapLeft;
                    const overlapBottom = overlap - overlapTop;
                    
                    // Clamp to image bounds
                    const x1 = Math.max(0, baseX - overlapLeft);
                    const y1 = Math.max(0, baseY - overlapTop);
                    const x2 = Math.min(width, (c + 1) * cellWidth + overlapRight);
                    const y2 = Math.min(height, (r + 1) * cellHeight + overlapBottom);
                    
                    const tileW = x2 - x1;
                    const tileH = y2 - y1;
                    
                    const div = document.createElement('div');
                    div.className = 'slice-rect';
                    div.style.left = (x1 / width * 100) + '%';
                    div.style.top = (y1 / height * 100) + '%';
                    
                    div.style.width = (tileW / width * 100) + '%';
                    div.style.height = (tileH / height * 100) + '%';
                    
                    gridOverlay.appendChild(div);
                }
            }
        }

        splitBtn.addEventListener('click', () => {
            if (!originalImage) return;

            showLoading("Processing & Zipping...");

            // Yield to render the loading spinner
            setTimeout(async () => {
                try {
                    const cols = parseInt(colsInput.value) || 1;
                    const rows = parseInt(rowsInput.value) || 1;
                    const overlap = parseInt(overlapInput.value) || 0;
                    const width = originalImage.width;
                    const height = originalImage.height;
                    const cellWidth = Math.ceil(width / cols);
                    const cellHeight = Math.ceil(height / rows);

                    const zip = new JSZip();
                    const folder = zip.folder("split_images");

                    resultArea.style.display = 'block';
                    imageGrid.innerHTML = '';
                    imageGrid.style.gridTemplateColumns = `repeat(${Math.min(cols, 5)}, 1fr)`;

                    let count = 0;
                    
                    // Create a temporary canvas for slicing
                    const tileCanvas = document.createElement('canvas');
                    const tileCtx = tileCanvas.getContext('2d');

                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            count++;
                            // Center Overlap Logic
                            const baseX = c * cellWidth;
                            const baseY = r * cellHeight;
                            
                            const overlapLeft = Math.floor(overlap / 2);
                            const overlapTop = Math.floor(overlap / 2);
                            const overlapRight = overlap - overlapLeft;
                            const overlapBottom = overlap - overlapTop;
                            
                            // Clamp to bounds
                            const x1 = Math.max(0, baseX - overlapLeft);
                            const y1 = Math.max(0, baseY - overlapTop);
                            const x2 = Math.min(width, (c + 1) * cellWidth + overlapRight);
                            const y2 = Math.min(height, (r + 1) * cellHeight + overlapBottom);

                            const tileW = x2 - x1;
                            const tileH = y2 - y1;

                            tileCanvas.width = tileW;
                            tileCanvas.height = tileH;
                            
                            // Clear canvas
                            tileCtx.clearRect(0,0, tileW, tileH);
                            
                            // Draw portion
                            // Source coordinates are now x1, y1 since we calculated clamped start
                            tileCtx.drawImage(originalImage, x1, y1, tileW, tileH, 0, 0, tileW, tileH);
                            
                            // Create blob
                            constblob = await new Promise(resolve => tileCanvas.toBlob(resolve, 'image/png'));
                            const fileName = `split_${r+1}_${c+1}.png`;
                            folder.file(fileName, constblob);

                            // Add small preview (limit to first 12 to save memory/dom)
                            if (count <= 12) {
                                const img = document.createElement('img');
                                img.src = URL.createObjectURL(constblob);
                                img.className = 'image-piece';
                                imageGrid.appendChild(img);
                            }
                        }
                    }
                    
                    if (count > 12) {
                        const msg = document.createElement('p');
                        msg.textContent = `...and ${count - 12} more images.`;
                        msg.style.gridColumn = '1 / -1';
                        msg.style.textAlign = 'center';
                        imageGrid.appendChild(msg);
                    }

                    showLoading("Generating ZIP file...");
                    const zipContent = await zip.generateAsync({type:"blob"});
                    saveAs(zipContent, "split-images.zip");
                    
                } catch (err) {
                    console.error(err);
                    alert("An error occurred during processing: " + err.message);
                } finally {
                    hideLoading();
                }
            }, 100);
        });

    </script>
</body>
</html>
